<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>凌睿前端招新 - 弹窗</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <style>
      @import url('https://fontsapi.zeoseven.com/315/main/result.css');

      .pout {
        z-index: 5;
        font-family: 'PixelMplus12';
        font-weight: normal;
        position: absolute;
        display: flex;
        flex-direction: column;
        max-width: 400px;
        min-width: 280px;
        background: rgb(227, 199, 220);
        border: 4px solid #e1daff;
        box-shadow: 2px 2px #beb4e5;
        will-change: transform;
      }
      .ptitle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
        padding: 0 12px;
        height: 36px;
        background: rgb(80, 57, 255);
        font-size: 16px;
        cursor: move;
        user-select: none;
        touch-action: none;
      }
      .pcontent {
        padding: 16px;
        color: #000;
        display: flex;
        flex-direction: column;
        gap: 20px;
        user-select: none;
      }
      .pbuttons {
        display: flex;
        margin-bottom: 16px;
        justify-content: center;
        gap: 24px;
      }
      .pbtn {
        user-select: none;
        font-size: 14px;
        background: rgb(227, 199, 220);
        color: #000;
        border: 2px solid #000;
        box-shadow: 2px 2px 0 #000;
        padding: 6px 20px;
        cursor: pointer;
        transition: all 0.1s;
      }
      .pbtn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
    </style>
    <!-- #region -->
    <style>
      :root {
        --bg: #fafafa;
        --fg: #111;
        --muted: #8a8a8a;
        --line: #e4e4e4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        width: 100%;
        max-width: 380px;
      }

      h1 {
        margin: 0 0 32px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .field {
        display: block;
        margin-bottom: 26px;
      }

      .label {
        display: block;
        margin-bottom: 8px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      input[type='text'],
      input[type='url'],
      textarea {
        width: 100%;
        padding: 8px 0;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        background: none;
        color: inherit;
        font: inherit;
        outline: none;
        transition: border-color 0.18s ease;
      }

      textarea {
        resize: none;
        display: block;
      }

      input::placeholder,
      textarea::placeholder {
        color: #c8c8c8;
      }

      input:focus,
      textarea:focus {
        border-color: var(--fg);
      }

      .invalid {
        border-color: #e5484d;
      }

      button {
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 9px;
        background: var(--fg);
        color: #fff;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        transition: opacity 0.18s ease;
      }

      button:hover {
        opacity: 0.85;
      }
      button:active {
        opacity: 0.7;
      }

      pre {
        margin: 28px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        line-height: 1.7;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-all;
      }

      pre:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <form id="popup-form" novalidate>
        <h1>设计弹窗</h1>

        <label class="field">
          <span class="label">标题</span>
          <input
            id="title"
            name="title"
            type="text"
            placeholder="输入标题"
            autocomplete="off"
          />
        </label>

        <label class="field">
          <span class="label">文字内容</span>
          <textarea
            id="text"
            name="text"
            rows="3"
            placeholder="输入文字内容"
          ></textarea>
        </label>

        <label class="field">
          <span class="label">跳转链接</span>
          <input
            id="link"
            name="link"
            type="url"
            placeholder="https://…"
            autocomplete="off"
          />
        </label>

        <button type="submit">弹窗</button>
      </form>

      <pre id="out"></pre>
    </div>

    <script>
      const form = document.getElementById('popup-form')
      const titleEl = document.getElementById('title')
      const textEl = document.getElementById('text')
      const linkEl = document.getElementById('link')

      /* 简单校验 */
      function mark (el) {
        el.classList.add('invalid')
        el.focus()
        el.addEventListener('input', () => el.classList.remove('invalid'), {
          once: true
        })
      }

      /* 收集结果 */
      form.addEventListener('submit', e => {
        e.preventDefault()

        let link = (linkEl.value || '').trim()
        if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link

        const data = {
          title: titleEl.value.trim(),
          type: 'text',
          text: textEl.value.trim(),
          link
        }

        if (!data.title) return mark(titleEl)
        if (!data.text) return mark(textEl)

        pop(JSON.stringify(data, null, 2))
      })
    </script>
    <script src="./popup.js"></script>
  </body>
  <!-- #endregion -->
</html>
