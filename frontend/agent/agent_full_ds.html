<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HanYe Agent CTF</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#8b93a5; --accent:#4f8cff;
    --ok:#34d399; --err:#f87171; --purple:#8b5cf6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px;
  }
  .app{display:flex;flex-direction:column;height:100dvh}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);
    flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.3px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .topbar-actions{display:flex;align-items:center;gap:8px}
  .status{font-size:12px;color:var(--muted);margin-right:4px}
  .btn{
    border:1px solid var(--border);background:var(--panel-2);color:var(--text);
    padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;
    transition:.15s;font-family:inherit;
  }
  .btn:hover{background:#252a34;border-color:#3a4150}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:#3d7bef}
  .btn.primary:disabled{background:#2c4a80;border-color:#2c4a80}

  /* ---------- 设置面板 ---------- */
  .settings{
    background:var(--panel);border-bottom:1px solid var(--border);
    padding:14px 16px;flex-shrink:0;
  }
  .settings.hidden{display:none}
  .settings-inner{max-width:800px;margin:0 auto;display:grid;gap:10px}
  .field{display:grid;gap:5px}
  .field label{font-size:12px;color:var(--muted)}
  .field input{
    background:#0d1015;border:1px solid var(--border);border-radius:7px;
    padding:8px 10px;color:var(--text);font-size:13px;font-family:inherit;outline:none;
  }
  .field input:focus{border-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted);line-height:1.7}
  .hint code{background:#0d1015;padding:1px 5px;border-radius:4px;color:#a9b4c8}

  /* ---------- 聊天区 ---------- */
  .chat{flex:1;overflow-y:auto;padding:20px 16px 8px;scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:8px}
  .chat::-webkit-scrollbar-thumb{background:#2a2f3a;border-radius:4px}

  .msg{max-width:800px;margin:0 auto 12px;display:flex}
  .msg.user{justify-content:flex-end}
  .msg.assistant{justify-content:flex-start}
  .msg.tool{justify-content:flex-start}
  .msg.system{justify-content:center}

  .bubble{
    padding:10px 14px;border-radius:12px;line-height:1.65;
    white-space:pre-wrap;word-break:break-word;max-width:100%;
  }
  .msg.user .bubble{background:#2b5fd9;color:#fff;border-bottom-right-radius:4px}
  .msg.assistant .bubble{
    background:var(--panel-2);border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .msg.error .bubble{
    background:#2a1618;border:1px solid #5b2b2f;color:#ffb4b4;
    border-bottom-left-radius:4px;
  }
  .msg.system .bubble{
    background:transparent;border:1px dashed var(--border);
    color:var(--muted);font-size:12px;padding:6px 12px;border-radius:20px;
  }

  /* 工具卡片 */
  .tool-card{
    background:#12151b;border:1px solid var(--border);
    border-left:3px solid var(--purple);border-radius:8px;
    padding:8px 12px;font-size:13px;width:100%;
  }
  .tool-head{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:#c4b5fd;font-weight:600;letter-spacing:.3px;
  }
  .tool-head .tag{
    font-weight:400;color:var(--muted);font-size:11px;
    border:1px solid var(--border);padding:0 6px;border-radius:10px;
  }
  .tool-head .tag.ok{color:var(--ok);border-color:#1f5c46}
  .tool-head .tag.fail{color:var(--err);border-color:#5b2b2f}
  .tool-args{margin:6px 0 0;font-size:12px;color:#9aa4b8;font-family:ui-monospace,Menlo,Consolas,monospace}
  .tool-body{
    margin:6px 0 0;font-size:12px;line-height:1.55;white-space:pre-wrap;
    word-break:break-word;color:var(--muted);max-height:220px;overflow:auto;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }

  /* Flag 卡片 */
  .flag-card{
    width:100%;background:linear-gradient(135deg,#0d2a20,#12241c);
    border:1px solid #1f5c46;border-radius:12px;padding:14px 16px;
    box-shadow:0 0 24px rgba(52,211,153,.12);
  }
  .flag-label{
    font-size:11px;letter-spacing:1.4px;color:var(--ok);
    font-weight:700;margin-bottom:8px;
  }
  .flag-code{
    display:block;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:14px;color:#a7f3d0;word-break:break-all;line-height:1.6;
  }

  /* 思考中 */
  .pending .bubble{display:flex;align-items:center;gap:8px;color:var(--muted)}
  .pending .dots{display:inline-flex;gap:3px}
  .pending .dots i{
    width:5px;height:5px;border-radius:50%;background:var(--muted);
    animation:blink 1.2s infinite;
  }
  .pending .dots i:nth-child(2){animation-delay:.2s}
  .pending .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* ---------- 输入区 ---------- */
  .composer{
    border-top:1px solid var(--border);background:var(--panel);
    padding:12px 16px;flex-shrink:0;
  }
  .composer-inner{
    max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
  }
  #input{
    flex:1;resize:none;background:#0d1015;border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;
    font-family:inherit;line-height:1.5;outline:none;max-height:160px;
  }
  #input:focus{border-color:var(--accent)}
  #input::placeholder{color:#5a6377}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span><span>HanYe Agent CTF</span></div>
    <div class="topbar-actions">
      <span id="status" class="status">未配置</span>
      <button id="btn-settings" class="btn">设置</button>
      <button id="btn-reset" class="btn">重开</button>
    </div>
  </header>

  <section id="settings" class="settings hidden">
    <div class="settings-inner">
      <div class="field">
        <label>API Base（需以 /v1 结尾，例如 https://api.deepseek.com/v1）</label>
        <input id="api-base" type="text" placeholder="https://api.deepseek.com/v1" autocomplete="off">
      </div>
      <div class="field">
        <label>API Key</label>
        <input id="api-key" type="password" placeholder="sk-..." autocomplete="off">
      </div>
      <div class="field">
        <label>模型</label>
        <input id="api-model" type="text" placeholder="deepseek-chat" autocomplete="off">
      </div>
      <div class="hint">
        浏览器直连第三方 API 需要对方允许 CORS；若请求失败，请检查 API Base / Key / 模型名，或改用支持 CORS 的网关。
        配置仅保存在本机 localStorage。
      </div>
    </div>
  </section>

  <main id="chat" class="chat"></main>

  <footer class="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="和 Agent 协作推理目标电影…（Enter 发送 / Shift+Enter 换行）"></textarea>
      <button id="send" class="btn primary">发送</button>
    </div>
  </footer>
</div>

  /* ============================================================
   *  2. 游戏核心（闭包内，不外泄片名）
   * ============================================================ */

  const Game = (() => {
    // 剥离片名，只保留可查询属性
    const TITLES = [];
    const POOL = RAW_MOVIES.map((m) => {
      TITLES.push(m['片名']);
      const copy = {};
      for (const k of Object.keys(m)) {
        if (k === '片名') continue;
        copy[k] = m[k];
      }
      return Object.freeze(copy);
    });

    let targetIndex = -1;
    let answer = '';
    let solved = false;
    let attempts = 0;

    const normalize = (s) => String(s).replace(/\s+/g, '').trim();

    function init() {
      targetIndex = Math.floor(Math.random() * POOL.length);
      answer = TITLES[targetIndex];
      solved = false;
      attempts = 0;
    }

    function query(field) {
      if (!SEARCH_FIELDS.includes(field)) return null;
      const v = POOL[targetIndex][field];
      return v === undefined ? null : v;
    }

    function tryDecrypt(candidate) {
      if (solved) {
        return { ok: true, flag: revealFlag(), note: '此前已解锁' };
      }
      if (attempts >= CONFIG.MAX_DECRYPT_ATTEMPTS) {
        return { ok: false, error: '验证次数已达上限，请重新开始本局。' };
      }
      attempts += 1;

      if (normalize(candidate) === normalize(answer)) {
        solved = true;
        return { ok: true, flag: revealFlag() };
      }
      return {
        ok: false,
        error: '片名不正确。',
        remaining: CONFIG.MAX_DECRYPT_ATTEMPTS - attempts
      };
    }

    return {
      init,
      query,
      tryDecrypt,
      isSolved: () => solved,
      attemptsLeft: () => CONFIG.MAX_DECRYPT_ATTEMPTS - attempts
    };
  })();

  /* ============================================================
   *  3. 工具定义（发给模型的 schema 与本地实现）
   * ============================================================ */

  const TOOLS = [
    {
      type: 'function',
      function: {
        name: 'search',
        description: '查询目标电影的一个属性。每次只查询一个字段，不要并发批量查询。',
        parameters: {
          type: 'object',
          properties: {
            value: {
              type: 'string',
              enum: SEARCH_FIELDS,
              description: '要查询的字段名'
            }
          },
          required: ['value'],
          additionalProperties: false
        }
      }
    },
    {
      type: 'function',
      function: {
        name: 'decrypt',
        description: '验证用户给出的完整中文电影名并解锁 flag。仅当用户明确给出完整候选片名时才调用，不要自己编造片名尝试。',
        parameters: {
          type: 'object',
          properties: {
            name: {
              type: 'string',
              description: '完整的中文电影名'
            }
          },
          required: ['name'],
          additionalProperties: false
        }
      }
    }
  ];

  function executeTool(name, args) {
    try {
      if (name === 'search') {
        const value = String(args && args.value != null ? args.value : '');
        if (!SEARCH_FIELDS.includes(value)) {
          return { ok: false, error: '不支持的查询字段：' + value, allowed: SEARCH_FIELDS };
        }
        const info = Game.query(value);
        if (info === null) {
          return { ok: false, error: '该字段暂无数据。' };
        }
        return { ok: true, field: value, value: info };
      }

      if (name === 'decrypt') {
        const candidate = String(args && args.name != null ? args.name : '').trim();
        if (!candidate) {
          return { ok: false, error: '候选片名不能为空。' };
        }
        return Game.tryDecrypt(candidate);
      }

      return { ok: false, error: '未知工具：' + name };
    } catch (e) {
      return { ok: false, error: '工具执行异常：' + (e && e.message ? e.message : String(e)) };
    }
  }

  /* ============================================================

  const State = {

   *  6. DOM 引用与 UI 工具

    chatEl.scrollTop = chatEl.scrollHeight;

  function pushBubble(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;          // 始终用 textContent，避免注入

    chatEl.appendChild(wrap);
    scrollToBottom();

  }

  function pushSystem(text) {
    pushBubble('system', text);
  }

  function pushToolCard(fnName, args, result) {
    const wrap = document.createElement('div');
    wrap.className = 'msg tool';

    const card = document.createElement('div');
    card.className = 'tool-card';

    const head = document.createElement('div');
    head.className = 'tool-head';

    nameSpan.textContent = fnName;
    head.appendChild(nameSpan);

    tag.className = 'tag ' + (ok ? 'ok' : 'fail');
    tag.textContent = ok ? 'success' : 'failed';
    head.appendChild(tag);

    card.appendChild(head);

    const argsEl = document.createElement('div');
    argsEl.className = 'tool-args';
    argsEl.textContent = '↳ ' + safeStringify(args);
    card.appendChild(argsEl);

    const body = document.createElement('pre');
    body.className = 'tool-body';
    body.textContent = safeStringify(result);
    card.appendChild(body);

    wrap.appendChild(card);
    chatEl.appendChild(wrap);

  function pushFlagCard(flag) {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';

    const card = document.createElement('div');

    card.appendChild(label);

  function pushPending(text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant pending';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const label = document.createElement('span');
    label.textContent = text || 'Agent 正在思考';

    const dots = document.createElement('span');
    dots.className = 'dots';
    dots.appendChild(document.createElement('i'));
    dots.appendChild(document.createElement('i'));
    dots.appendChild(document.createElement('i'));

    bubble.appendChild(label);
    bubble.appendChild(dots);
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);

    return wrap;

  function safeStringify(v) {
    try {
      if (typeof v === 'string') return v;
      return JSON.stringify(v, null, 2);
    } catch (_) {
      return String(v);
    }
  }

  /* ============================================================
   *  7. 配置读写
   * ============================================================ */

  function loadConfig() {
    try {
      const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        State.cfg = Object.assign({}, DEFAULT_CONFIG, parsed);
        return;
      }
    } catch (_) { /* 忽略损坏的本地配置 */ }
    State.cfg = Object.assign({}, DEFAULT_CONFIG);
  }

  function saveConfig() {
    try {
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(State.cfg));
    } catch (_) { /* 隐私模式下可能失败 */ }
  }

  function syncConfigToUI() {
    apiBaseEl.value = State.cfg.base || '';
    apiKeyEl.value = State.cfg.key || '';
    apiModelEl.value = State.cfg.model || '';
    updateStatus();
  }

  function syncUIToConfig() {
    State.cfg.base = apiBaseEl.value.trim();
    State.cfg.key = apiKeyEl.value.trim();
    State.cfg.model = apiModelEl.value.trim();
    saveConfig();
    updateStatus();
  }

  function updateStatus() {
    const configured = !!(State.cfg.base && State.cfg.key && State.cfg.model);
    if (!configured) {
      statusEl.textContent = '未配置';
      statusEl.style.color = 'var(--err)';
    } else if (State.solved) {
      statusEl.textContent = '已解锁';
      statusEl.style.color = 'var(--ok)';
    } else {
      statusEl.textContent = '就绪 · ' + State.cfg.model;
      statusEl.style.color = 'var(--muted)';
    }
  }

  /* ============================================================
   *  8. API 调用
   * ============================================================ */

  function buildEndpoint(base) {
    const trimmed = String(base || '').replace(/\/+$/, '');
    return trimmed + '/chat/completions';
  }

  async function callChatAPI(messages, signal) {
    const res = await fetch(buildEndpoint(State.cfg.base), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + State.cfg.key
      },
      body: JSON.stringify({
        model: State.cfg.model,
        messages,
        tools: TOOLS,
        tool_choice: 'auto'
      }),
      signal
    });

    const data = await res.json().catch(() => null);

    if (!res.ok) {
      const detail =
        (data && data.error && data.error.message) ||
        (data && data.message) ||
        ('HTTP ' + res.status);
      throw new Error(detail);
    }
    if (!data || !Array.isArray(data.choices) || !data.choices[0]) {
      throw new Error('响应格式异常：缺少 choices');
    }
    return data.choices[0].message;
  }

  /* ============================================================
   *  9. 消息规范化与参数解析
   * ============================================================ */

  function normalizeAssistantMessage(msg) {
    const out = { role: 'assistant' };

    if (typeof msg.content === 'string') {
      out.content = msg.content;
    } else if (Array.isArray(msg.content)) {
      out.content = msg.content
        .map((p) => {
          if (typeof p === 'string') return p;
          if (p && typeof p.text === 'string') return p.text;
          return '';
        })
        .join('');
    } else {
      out.content = '';
    }

    if (Array.isArray(msg.tool_calls) && msg.tool_calls.length > 0) {
      out.tool_calls = msg.tool_calls.map((tc, i) => {
        const fn = (tc && tc.function) || {};
        let rawArgs = fn.arguments;
        if (rawArgs != null && typeof rawArgs !== 'string') {
          try {
            rawArgs = JSON.stringify(rawArgs);
          } catch (_) {
            rawArgs = '{}';
          }
        }
        if (typeof rawArgs !== 'string' || rawArgs.trim() === '') {
          rawArgs = '{}';
        }
        return {
          id: (tc && tc.id) || ('call_' + Date.now() + '_' + i),
          type: 'function',
          function: {
            name: fn.name || '',
            arguments: rawArgs
          }
        };
      });
    }

    return out;
  }

  function parseArgs(raw) {
    if (raw == null) return {};
    if (typeof raw === 'object') return raw;
    if (typeof raw === 'string') {
      const s = raw.trim();
      if (s === '') return {};
      try {
        const parsed = JSON.parse(s);
        return (parsed && typeof parsed === 'object') ? parsed : {};
      } catch (_) {
        return null; // 明确告知调用方：参数非法
      }
    }
    return {};
  }

  /* ============================================================
   * 10. Agent 主循环
   * ============================================================ */

  async function runAgent(userText) {
    State.busy = true;
    sendBtn.disabled = true;
    inputEl.disabled = true;

    pushBubble('user', userText);
    State.context.push({ role: 'user', content: userText });

    let toolCallCount = 0;

    try {
      for (let turn = 0; turn < CONFIG.MAX_TURNS; turn++) {
        const pending = pushPending(turn === 0 ? 'Agent 正在思考' : 'Agent 正在继续推理');

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT_MS);

        let rawMessage;
        try {
          rawMessage = await callChatAPI(State.context, controller.signal);
        } finally {
          clearTimeout(timer);
          pending.remove();
        }

        const assistantMsg = normalizeAssistantMessage(rawMessage);
        State.context.push(assistantMsg);

        const hasToolCalls =
          Array.isArray(assistantMsg.tool_calls) && assistantMsg.tool_calls.length > 0;

        // ---- 没有工具调用：直接输出文本，结束本轮 ----
        if (!hasToolCalls) {
          const text = (assistantMsg.content || '').trim();
          pushBubble('assistant', text || '（模型没有返回内容）');
          return;
        }

        // ---- 有工具调用：先把可见文本显示出来 ----
        if (assistantMsg.content && assistantMsg.content.trim()) {
          pushBubble('assistant', assistantMsg.content.trim());
        }

        // ---- 依次执行工具 ----
        for (const tc of assistantMsg.tool_calls) {
          const fnName = tc.function && tc.function.name;

          // 超限也必须给出响应，否则后续请求会因缺少 tool 消息而失败
          if (toolCallCount >= CONFIG.MAX_TOOL_CALLS) {
            State.context.push({
              role: 'tool',
              tool_call_id: tc.id,
              content: JSON.stringify({
                ok: false,
                error: '本次会话工具调用次数已达上限，请直接与用户交流。'
              })
            });
            continue;
          }
          toolCallCount += 1;

          const args = parseArgs(tc.function && tc.function.arguments);
          const result =
            args === null
              ? { ok: false, error: '工具参数不是合法的 JSON 对象。' }
              : executeTool(fnName, args);

          pushToolCard(fnName, args === null ? '(非法参数)' : args, result);

          State.context.push({
            role: 'tool',
            tool_call_id: tc.id,
            content: JSON.stringify(result)
          });

          // 解锁成功：立即收尾
          if (fnName === 'decrypt' && result && result.ok && result.flag) {
            onSolved(result.flag);
            return;
          }
        }
      }

      pushBubble('error', '已达到最大推理轮次上限，本轮对话结束。可以换个说法继续和 Agent 沟通。');
    } catch (err) {
      if (err && err.name === 'AbortError') {
        pushBubble('error', '请求超时（' + Math.round(CONFIG.REQUEST_TIMEOUT_MS / 1000) + 's），请检查网络或模型服务。');
      } else {
        pushBubble('error', '请求失败：' + ((err && err.message) ? err.message : String(err)));
      }
    } finally {
      State.busy = false;
      sendBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  }

  function onSolved(flag) {
    State.solved = true;
    Game.isSolved && Game.isSolved();
    pushFlagCard(flag);
    pushSystem('本局已结束，点击右上角「重开」可以换一部目标电影。');
    updateStatus();
  }

  /* ============================================================
   * 11. 会话生命周期
   * ============================================================ */

  function resetGame() {
    State.context = [{ role: 'system', content: buildSystemPrompt() }];
    State.solved = false;
    State.busy = false;

    Game.init();

    clearChat();
    pushSystem('新的一局开始。目标电影已随机选定，和 Agent 一起推理出它的中文片名吧。');
    pushSystem('提示：让 Agent 调用 search 查询上映时间 / 导演 / 主演 / 类型 / 获奖 / 对白语言等信息，逐步缩小范围。');

    sendBtn.disabled = false;
    inputEl.disabled = false;
    updateStatus();
  }

  async function handleSend() {
    if (State.busy) return;

    const text = inputEl.value.trim();
    if (!text) return;

    if (!State.cfg.base || !State.cfg.key || !State.cfg.model) {
      settingsEl.classList.remove('hidden');
      pushSystem('请先在「设置」中填写 API Base、API Key 和模型名。');
      return;
    }

    inputEl.value = '';
    autoResize();
    await runAgent(text);
  }

  /* ============================================================
   * 12. 事件绑定
   * ============================================================ */

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  }

  function bindEvents() {
    sendBtn.addEventListener('click', handleSend);

    inputEl.addEventListener('input', autoResize);

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        handleSend();
      }
    });

    $('btn-settings').addEventListener('click', () => {
      settingsEl.classList.toggle('hidden');
    });

    $('btn-reset').addEventListener('click', () => {
      if (State.busy) return;
      resetGame();
    });

    [apiBaseEl, apiKeyEl, apiModelEl].forEach((el) => {
      el.addEventListener('change', syncUIToConfig);
      el.addEventListener('blur', syncUIToConfig);
    });
  }

  /* ============================================================
   * 13. 启动
   * ============================================================ */

  function boot() {
    loadConfig();
    syncConfigToUI();
    bindEvents();
    resetGame();

    if (!State.cfg.key) {
      settingsEl.classList.remove('hidden');
    }

    autoResize();
    inputEl.focus();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
